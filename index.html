<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drafting Sheet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Draw archaeological plans and sections to scale from field measurements.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Field Drafting Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a drafting table — the to-scale sheet dominates, a measurement panel sits beside it like a field notebook. */
:root{
  --chrome:#eceff0;
  --panel:#fbfcfb;
  --paper:#f7f9f4;
  --ink:#1c2826;
  --ink-2:#56645f;
  --rule:#d6ddd8;
  --grid-minor:#d2e6d9;
  --grid-major:#8fbfa3;
  --accent:#1f5fa8;
  --accent-ink:#ffffff;
  --accent-soft:#dce7f4;
  --mark:#c23a2c;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chrome:#0e1513;--panel:#141d1a;--paper:#17221f;--ink:#e2ebe6;--ink-2:#9db0a8;--rule:#2a3833;
    --grid-minor:#1f342d;--grid-major:#33604f;--accent:#7cb1f0;--accent-ink:#0b1420;--accent-soft:#1c2c41;--mark:#ff8170;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chrome:#0e1513;--panel:#141d1a;--paper:#17221f;--ink:#e2ebe6;--ink-2:#9db0a8;--rule:#2a3833;
  --grid-minor:#1f342d;--grid-major:#33604f;--accent:#7cb1f0;--accent-ink:#0b1420;--accent-soft:#1c2c41;--mark:#ff8170;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--chrome);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:1480px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:.005em;text-wrap:balance}
.tabs{display:flex;gap:0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.tab{appearance:none;border:0;background:transparent;color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;padding:8px 18px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab+.tab{border-left:1px solid var(--rule)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab svg{width:16px;height:16px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit}
.btn{appearance:none;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font-family:var(--body);font-weight:600;font-size:13.5px;padding:6px 11px;border-radius:5px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--mark)}
.btn.armed{background:var(--mark);border-color:var(--mark);color:var(--panel)}
.btn.small{font-size:12.5px;padding:4px 9px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.data-panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.data-panel p{margin:0;color:var(--ink-2);max-width:70ch}
.data-panel textarea{width:100%;min-height:140px;font-family:var(--mono);font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:8px;resize:vertical}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.view{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:960px){.view{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tool{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:13.5px;cursor:pointer}
.tool .knob{width:28px;height:16px;border-radius:999px;background:var(--rule);position:relative;transition:background .15s}
.tool .knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--panel);transition:transform .15s}
.tool[aria-pressed="true"]{border-color:var(--accent)}
.tool[aria-pressed="true"] .knob{background:var(--accent)}
.tool[aria-pressed="true"] .knob::after{transform:translateX(12px)}
.hint{color:var(--ink-2);font-size:13.5px;flex:1 1 220px;min-width:0}
.readout{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:4px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{margin:0;color:var(--mark);font-weight:600}
.sheet-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--paper)}
.sheet-wrap svg{display:block;width:100%;height:auto;min-width:620px;user-select:none;-webkit-user-select:none}
.sheet-wrap svg.editing{cursor:crosshair;touch-action:none}
.sheet-wrap svg [data-v]{cursor:grab}
.sheet-wrap svg [data-sel]{cursor:pointer}
.reg-title{margin:4px 0 0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.reg th,.reg td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:middle;font-size:14px}
.reg th{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.reg td.num{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.reg .sw-cell svg{display:block}
.ctx{font-family:var(--mono);font-weight:500;white-space:nowrap}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2,.card summary{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;margin:0}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-family:var(--mono);color:var(--ink-2)}
details.card[open] summary::after{content:"–"}
details.card > .fields{margin-top:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=number],select,textarea{font-family:var(--body);font-size:14.5px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-size:13.5px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:2px}
.lrow{appearance:none;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);padding:7px 8px;border-radius:5px;cursor:pointer}
.lrow:hover{background:var(--paper)}
.lrow[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lrow .ct{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.lrow-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center}
.delic{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;background:transparent;color:var(--ink-2);height:32px;min-width:32px;padding:0 7px;border-radius:5px;cursor:pointer;font-weight:600;font-size:12.5px}
.delic svg{width:16px;height:16px}
.delic:hover{color:var(--mark);border-color:var(--rule);background:var(--paper)}
.delic.armed{background:var(--mark);border-color:var(--mark);color:var(--panel)}
.mpicker{display:flex;flex-direction:column;gap:8px}
.mpages{display:flex;flex-wrap:wrap;gap:4px}
.mpage{appearance:none;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);font-family:var(--mono);font-size:12px;padding:3px 7px;border-radius:4px;cursor:pointer}
.mpage[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mgrid{display:grid;gap:4px;align-items:center;padding:8px;background:var(--paper);border:1px solid var(--rule);border-radius:5px}
.mh{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:center;white-space:nowrap}
.mchip{appearance:none;display:block;aspect-ratio:1.25;width:100%;border:0;border-radius:3px;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);transition:transform .1s}
.mchip.none{box-shadow:none;background:transparent;cursor:default}
.mchip:not(.none):hover{transform:scale(1.1)}
.mchip[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.msel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.msel b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.msel .big{width:30px;height:20px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ed-title{font-family:var(--display);font-weight:700;font-size:17px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25);display:inline-block;flex:none}
.ltabs{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:0;border-bottom:1px solid var(--rule)}
.ltab{appearance:none;display:inline-flex;align-items:center;border:1px solid var(--rule);border-bottom:0;background:var(--paper);color:var(--ink-2);border-radius:5px 5px 0 0;margin-bottom:-1px;font-family:var(--mono);font-size:13px;white-space:nowrap}
.ltab.on{background:var(--panel);color:var(--ink);border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.ltab-sel{appearance:none;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:inherit;font:inherit;padding:6px 2px 6px 10px;cursor:pointer}
.ltab .delic{height:26px;min-width:26px;padding:0 5px;margin:0 3px}
.ltab .delic svg{width:14px;height:14px}
.ltab.add{padding:6px 10px;cursor:pointer;font-family:var(--body);font-weight:600;color:var(--accent)}
.note{margin:0;font-size:13px;color:var(--ink-2)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatch{appearance:none;width:26px;height:26px;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatch[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--panel)}
input[type=color]{width:34px;height:28px;padding:0 2px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.addpt{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;padding:10px;background:var(--paper);border:1px dashed var(--grid-major);border-radius:5px}
.pts{font-size:13px}
.pts th{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:2px 4px}
.pts td{padding:2px 4px}
.pts td.idx{font-family:var(--mono);color:var(--ink-2);width:28px;text-align:right}
.pts input{padding:4px 6px}
.pts tr.hot td.idx{color:var(--mark);font-weight:600}
.xbtn{appearance:none;border:0;background:transparent;color:var(--ink-2);font-size:18px;line-height:1;width:28px;height:28px;border-radius:4px;cursor:pointer}
.xbtn:hover{color:var(--mark);background:var(--paper)}
.ptscroll{max-height:320px;overflow:auto;border:1px solid var(--rule);border-radius:4px}
.ptscroll thead th{position:sticky;top:0;background:var(--panel)}
.empty{margin:0;padding:12px;border:1px dashed var(--rule);border-radius:5px;color:var(--ink-2);font-size:14px}
.bulk summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.bulk textarea{margin-top:8px;min-height:96px;font-family:var(--mono);font-size:13px}
.bulk .row-btns{margin-top:8px}
.status{margin:0;font-size:13px;color:var(--ink-2)}
.metrics{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;padding:10px 12px;background:var(--paper);border-radius:5px;border:1px solid var(--rule)}
.metrics dt{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.metrics dd{margin:0;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.pdfpanel{border:1px solid var(--accent);background:var(--paper);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pdfpanel h3{margin:0;font-family:var(--display);font-weight:700;font-size:17px}
.pdf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pdf-info{margin:0;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;max-width:80ch}
.pdf-info .bad{color:var(--mark);font-weight:600}
.pdf-info div+div{margin-top:3px}
@media (pointer:coarse){input[type=text],input[type=number],select,textarea{font-size:16px}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:5px;font-weight:600;font-size:14px;z-index:20}
@media (max-width:520px){h1{font-size:25px}.top-actions{margin-left:0}.addpt{grid-template-columns:1fr 1fr}.addpt .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Excavation record · measured drawing</span>
      <h1>Field Drafting Sheet</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Drawing type">
      <button class="tab" role="tab" id="tab-plan" data-tab="plan" aria-controls="view-plan">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13"/><path d="M4 9c0-3 2-5 4.5-4.5S12 8 10.5 10.5 4 12 4 9z"/></svg>Plan view</button>
      <button class="tab" role="tab" id="tab-section" data-tab="section" aria-controls="view-section">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1 3.5h14M1 7c4-1 9 1 14 0M1 11c3 .5 6-.5 9 .5s4 0 5 0"/></svg>Section layers</button>
    </nav>
    <div class="top-actions">
      <button class="btn" id="undoBtn" disabled>Undo</button>
      <button class="btn" id="dataBtn" aria-expanded="false" aria-controls="dataPanel">Save / load data</button>
    </div>
  </header>

  <div class="data-panel" id="dataPanel" hidden>
    <p>Your drawings are kept in this browser automatically. To move them to another device or keep a backup, save a backup file or copy the text below, and load it back in later.</p>
    <textarea id="dataText" spellcheck="false" aria-label="Drawing data"></textarea>
    <div class="row-btns">
      <button class="btn primary" id="copyData">Copy data</button>
      <button class="btn" id="loadData">Load pasted data</button>
      <button class="btn" id="saveBackup">Save backup file</button>
      <button class="btn" id="openBackup">Open backup file</button>
      <input type="file" id="backupFile" accept=".json,application/json,text/plain" hidden>
      <button class="btn" id="resetData">Restore example drawings</button>
      <button class="btn danger" id="blankData">Start blank sheets</button>
      <span class="status" id="dataMsg"></span>
    </div>
  </div>

  <main id="views"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const r3=v=>Math.round(v*1000)/1000;
const n2=v=>isFinite(v)?String(+v.toFixed(2)):'–';
const FONT_MONO="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace";
const FONT_DISP="'Barlow Semi Condensed', 'Arial Narrow', sans-serif";
const UNITS=['cm','m','mm','in','ft'];
const FEATURE_COLORS=['#c0452f','#2f6fb5','#3d8a4c','#8a4fb0','#b0841c','#1f8a8a','#6b6f6d'];
const SOIL_COLORS=['#3e3128','#5b4636','#7a5a44','#a07a4f','#c9a46a','#d8c08a','#8c8a7a','#6e6a60','#9a5f3e','#b9a48c'];
const PATTERNS=[['none','Plain'],['sand','Sand (dots)'],['silt','Silt (dashes)'],['clay','Clay (lines)'],['gravel','Gravel (pebbles)'],['stone','Stones'],['charcoal','Charcoal flecks']];
const KINDS={
  plan:{item:'feature',Item:'Feature',xh:'X',yh:'Y',yDown:false},
  section:{item:'layer',Item:'Layer',xh:'Distance',yh:'Depth',yDown:true}
};
const STORE='field-drafting-sheet:v1';

/* ---------- Munsell soil colour ---------- */
const MFAM=['R','YR','Y','GY','G','BG','B','PB','P','RP'];
const HUE_ANCHORS=[[0,15],[2.5,20],[5,25],[10,38],[12.5,45],[15,55],[17.5,64],[20,74],[22.5,83],[25,92],[30,100],[35,115],[40,135],[45,160],[50,175],[55,190],[60,205],[65,225],[70,240],[75,265],[80,285],[90,320],[100,375]];
function hueAngle(step){
  step=((step%100)+100)%100;
  for(let i=1;i<HUE_ANCHORS.length;i++){const [s1,a1]=HUE_ANCHORS[i-1],[s2,a2]=HUE_ANCHORS[i];if(step<=s2)return a1+(a2-a1)*(step-s1)/(s2-s1);}
  return 15;
}
const hueStep=(num,fam)=>MFAM.indexOf(fam)*10+num;
function munsellHex(V,step,C){
  const Y=1.1914*V-0.22533*V**2+0.23352*V**3-0.020484*V**4+0.00081939*V**5;
  const L=116*Math.cbrt(Math.max(Y,0)/100)-16,h=hueAngle(step)*Math.PI/180;
  const conv=(cs)=>{
    const a=cs*Math.cos(h),b=cs*Math.sin(h),fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200;
    const fi=t=>t**3>0.008856?t**3:(t-16/116)/7.787;
    const X=0.95047*fi(fx),Yy=fi(fy),Z=1.08883*fi(fz);
    return[3.2406*X-1.5372*Yy-0.4986*Z,-0.9689*X+1.8758*Yy+0.0415*Z,0.0557*X-0.2040*Yy+1.0570*Z];
  };
  let cs=C*5.5,rgb=conv(cs);
  for(let k=0;k<60&&!rgb.every(v=>v>=0&&v<=1);k++){cs*=0.95;rgb=conv(cs);}

function buildSVG(kind,C,opt={}){

  const z=opt.z||1,PR=opt.print?'pr-':'',FM=opt.print?'Courier':FONT_MONO,FD=opt.print?'Helvetica':FONT_DISP,gw_=opt.print?0.6:1;

  const s=opt.s||(1000-mL-mR)/spanX;

  const X=x=>mL+(x-S.x0)*s,Y=K.yDown?y=>mT+(y-S.y0)*s:y=>mT+(S.y1-y)*s;
  const gx0=mL,gx1=mL+spanX*s,gy0=mT,gy1=mT+gh;

  o.push(`<rect width="${F(W)}" height="${F(H)}" fill="${C.paper}"/>`);
  const lines=(step,col,w)=>{
    if(spanX/step>600||spanY/step>600)return'';

    for(let i=Math.ceil(S.x0/step-1e-9);i*step<=S.x1+1e-9;i++){d+=`M${F(X(i*step))} ${F(gy0)}V${F(gy1)}`;}

    return`<path d="${d}" stroke="${col}" stroke-width="${F(w*z*gw_)}" fill="none" shape-rendering="crispEdges"/>`;
  };

  if(S.minor*2<S.major&&(S.major/S.minor)%2===0)o.push(lines(S.major/2,C.minor,1.6));
  o.push(lines(S.major,C.major,1.3));

  for(let i=Math.ceil(S.x0/S.major-1e-9);i*S.major<=S.x1+1e-9;i++){const v=r3(i*S.major);tx.push(`<text x="${F(X(v))}" y="${F(kind==='plan'?gy1+18*z:gy0-9*z)}" text-anchor="middle">${n2(v)}</text>`);}
  for(let i=Math.ceil(S.y0/S.major-1e-9);i*S.major<=S.y1+1e-9;i++){const v=r3(i*S.major);tx.push(`<text x="${F(gx0-8*z)}" y="${F(Y(v)+4*z)}" text-anchor="end">${n2(v)}</text>`);}

  o.push(`<text x="${F(gx0)}" y="${F(26*z)}" font-family="${FD}" font-weight="600" font-size="${F(20*z)}" fill="${C.ink}">${esc(S.title)}</text>`);
  const u=esc(S.unit);
  if(kind==='plan'){
    o.push(`<g font-family="${FM}" font-size="${F(11*z)}" fill="${C.ink2}"><text x="${F(gx0)}" y="${F(gy1+44*z)}">X (${u}) →</text><text transform="translate(${F(gx0-44*z)} ${F(gy0)}) rotate(-90)" text-anchor="end">Y (${u}) →</text></g>`);

  }else{
    cols=[['Key',0],['Context',.11],['Description',.53],['Munsell',.18],[`Depth (${u})`,.18]];
    rows=[...S.items].sort((a,b)=>(parseFloat(a.context)||0)-(parseFloat(b.context)||0)).map(it=>{const b=it.points.length?bbox(it.points):null;return{sw:it,cells:['',label(kind,it),it.desc||'',it.munsell||'-',b?n2(b.y0)+'–'+n2(b.y1):'-']};});
  }
  const keyW=kind==='section'?10:0,rest=availW-keyW;
  const widths=cols.map(c=>c[1]?c[1]*rest:keyW);
  const sizeMm=REG_SIZE/MMPT;
  rows.forEach(r=>{r.lines=r.cells.map((c,i)=>i===0&&kind==='section'?['']:wrapText(c,(widths[i]-2)*MMPT,REG_SIZE));r.h=Math.max(...r.lines.map(l=>l.length))*REG_LH+2.2;});
  const h=7+5+rows.reduce((a,r)=>a+r.h,0);
  return{cols,widths,rows,h,title:kind==='plan'?'Feature register':'Context register',sizeMm};
}
function layoutFor(kind){
  const S=S_(kind),paper=PAPERS[pdfOpts.paper]||PAPERS.letter,name=kind==='plan'?'Plan':'Section';
  if(!(S.x1>S.x0&&S.y1>S.y0&&S.minor>0&&S.major>0))return{ok:false,msg:`${name}: fix the sheet settings first.`};
  const z=PZ,fw=(60+30)*z,fh=((kind==='section'?70:60)+60)*z,spanX=S.x1-S.x0,spanY=S.y1-S.y0;
  const orients=pdfOpts.orient==='auto'?['portrait','landscape']:[pdfOpts.orient];
  const opts=orients.map(o=>{
    const pw=o==='portrait'?paper[0]:paper[1],ph=o==='portrait'?paper[1]:paper[0];
    const aw=pw-2*PMARGIN,ah=ph-2*PMARGIN-PFOOT,reg=pdfOpts.reg?regLayout(kind,aw):null,rh=reg?reg.h+5:0;
    let sc,fits,regSame;
    if(pdfOpts.scale==='fit'){
      const keep=reg&&rh<ah*0.4;
      sc=Math.min((aw-fw)/spanX,((keep?ah-rh:ah)-fh)/spanY);fits=sc>0;regSame=!!keep;
    }else{
      sc=UNIT_MM[S.unit]/(+pdfOpts.scale);
      const dw=spanX*sc+fw,dh=spanY*sc+fh;fits=dw<=aw+0.01&&dh<=ah+0.01;regSame=fits&&reg&&dh+rh<=ah;
    }
    return{orient:o,pw,ph,aw,ah,s:sc,fits,regSame:!!regSame,reg};
  });
  let best;
  if(pdfOpts.scale==='fit')best=opts.filter(o=>o.fits).sort((a,b)=>b.s-a.s)[0];
  else best=opts.find(o=>o.fits&&(o.regSame||!o.reg))||opts.find(o=>o.fits);
  const um=UNIT_MM[S.unit],ptxt=paper[2];
  if(!best){
    if(pdfOpts.scale==='fit')return{ok:false,msg:`${name}: the page is too small for this drawing.`};
    const sc=UNIT_MM[S.unit]/(+pdfOpts.scale),dw=Math.round(spanX*sc+fw),dh=Math.round(spanY*sc+fh);
    const ok=SCALES.filter(k=>opts.some(o=>spanX*um/k+fw<=o.aw&&spanY*um/k+fh<=o.ah));
    return{ok:false,msg:`${name} at 1:${pdfOpts.scale} needs about ${dw} × ${dh} mm and won’t fit on ${ptxt}${pdfOpts.orient==='auto'?'':' '+pdfOpts.orient}. `+(ok.length?`Try 1:${ok[0]} or larger paper.`:'Try larger paper.')};
  }
  const ratio=um/best.s,dw=Math.round(spanX*best.s+fw),dh=Math.round(spanY*best.s+fh);
  const scaleTxt=pdfOpts.scale==='fit'?`about 1:${ratio<10?ratio.toFixed(1):Math.round(ratio)}`:`1:${pdfOpts.scale}`;
  const regTxt=best.reg?(best.regSame?', register below':', register on next page'):'';
  return{ok:true,kind,...best,ratio,scaleTxt,msg:`${name}: ${scaleTxt}, ${dw} × ${dh} mm on ${ptxt} ${best.orient}${regTxt}.`};
}
function makePDF(layouts){
  const objs=[];const add=v=>{objs.push(v);return objs.length;};const reserve=()=>add(null);
  const stream=(dict,data)=>`<< ${dict} /Length ${data.length} >>\nstream\n${data}\nendstream`;
  const catId=reserve(),pagesId=reserve(),resId=reserve();
  const fonts={F1:'Courier',F2:'Courier-Bold',F3:'Helvetica-Bold',F4:'Helvetica'},fontIds={};
  Object.keys(fonts).forEach(k=>fontIds[k]=add(`<< /Type /Font /Subtype /Type1 /BaseFont /${fonts[k]} /Encoding /WinAnsiEncoding >>`));
  const gsMap={},patIds={};let gsN=0,patN=0;
  const gs=(key,a)=>{const k=key+(+a).toFixed(3);if(!gsMap[k])gsMap[k]={name:'G'+(++gsN),id:add(`<< /Type /ExtGState /${key} ${pf(a)} >>`)};return gsMap[k].name;};
  const pageIds=[],date=new Date().toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'});
  const txt=(out,x,yTop,str,font,size,ph,col,align)=>{let xx=x;const w=textW(str,size,font);if(align==='right')xx-=w;else if(align==='center')xx-=w/2;out.push(`BT /${font} ${pf(size)} Tf ${rgbStr(col||[0.11,0.157,0.149])} rg 1 0 0 1 ${pf(xx*1)} ${pf(ph-yTop)} Tm ${pdfStr(str)} Tj ET`);};
  const ink=pcol(PRINT_C.ink),ink2=pcol(PRINT_C.ink2),rule=pcol('#c9d1cc');
  layouts.forEach(L=>{
    const S=S_(L.kind),PW=L.pw*MMPT,PH=L.ph*MMPT,M=PMARGIN*MMPT;
    const b=buildSVG(L.kind,PRINT_C,{print:true,z:PZ,s:L.s,pts:pdfOpts.pts});
    const doc=new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${b.markup}</svg>`,'image/svg+xml');
    const root=doc.documentElement,ids={};root.querySelectorAll('[id]').forEach(e=>ids[e.getAttribute('id')]=e);
    const footer=(out,note)=>{
      const y=L.ph-PMARGIN-2;
      out.push(`${rgbStr(rule)} RG 0.4 w ${pf(M)} ${pf(PH-(y-5.5)*MMPT)} m ${pf(PW-M)} ${pf(PH-(y-5.5)*MMPT)} l S`);
      txt(out,M,y*MMPT,`${S.title}  ·  Field Drafting Sheet`,'F4',8,PH,ink2);
      txt(out,PW-M,y*MMPT,`Scale ${L.scaleTxt}  ·  Printed ${date}`,'F4',8,PH,ink2,'right');
      txt(out,M,(y+4)*MMPT,note,'F4',7,PH,ink2);
    };
    const note=pdfOpts.scale==='fit'?'Not printed to a fixed scale. Take measurements from the scale bar.':`Print at 100% (actual size) for the drawing to measure true at 1:${pdfOpts.scale}.`;
    const pages=[];
    // drawing page
    const out=[],ox=PMARGIN+(L.aw-b.W)/2,oy=PMARGIN,mtx=`${pf(MMPT)} 0 0 ${pf(-MMPT)} ${pf(ox*MMPT)} ${pf(PH-oy*MMPT)}`;
    const pageIdx=pageIds.length;
    const ctx={ids,gs,pattern(id){
      const key=pageIdx+':'+id;if(patIds[key])return patIds[key];
      const el=ids[id];if(!el)return null;
      const w=parseFloat(el.getAttribute('width')),h=parseFloat(el.getAttribute('height')),po=[];
      for(const c of el.children)svgOps(c,{},po,ctx);
      const name='P'+(++patN);
      const baseEl=el.querySelector('[data-base]');
      patIds[key]={name,base:baseEl&&baseEl.getAttribute('fill'),id:add(stream(`/Type /Pattern /PatternType 1 /PaintType 1 /TilingType 1 /BBox [0 0 ${pf(w)} ${pf(h)}] /XStep ${pf(w)} /YStep ${pf(h)} /Matrix [${mtx}] /Resources ${resId} 0 R`,po.join('\n')))};
      return patIds[key];
    }};
    out.push(`q ${mtx} cm`);svgOps(root,{},out,ctx);out.push('Q');
    const drawReg=(o2,top)=>{
      const R=L.reg;let y=top;
      txt(o2,M,(y+4)*MMPT,R.title,'F3',9.5,PH,ink);y+=7;
      let x=PMARGIN;R.cols.forEach((c,i)=>{txt(o2,x*MMPT,(y+3)*MMPT,c[0].toUpperCase(),'F3',6.5,PH,ink2);x+=R.widths[i];});y+=5;
      o2.push(`${rgbStr(rule)} RG 0.4 w ${pf(M)} ${pf(PH-y*MMPT)} m ${pf(PW-M)} ${pf(PH-y*MMPT)} l S`);
      R.rows.forEach(r=>{
        let x=PMARGIN;
        r.lines.forEach((ls,i)=>{ls.forEach((ln,j)=>txt(o2,(x)*MMPT,(y+1+REG_LH*(j+0.85))*MMPT,ln,'F4',REG_SIZE,PH,ink));x+=R.widths[i];});
        if(r.sw){
          const it=r.sw,sx=PMARGIN*MMPT,sy=PH-(y+1.2)*MMPT;
          if(it.type==='cut')o2.push(`${rgbStr(ink)} RG 1.2 w ${pf(sx)} ${pf(sy-1)} m ${pf(sx+5*MMPT)} ${pf(sy-3.4*MMPT)} ${pf(sx+3*MMPT)} ${pf(sy-3.4*MMPT)} ${pf(sx+8*MMPT)} ${pf(sy-1)} c S`);
          else o2.push(`${rgbStr(pcol(it.color)||ink)} rg ${rgbStr(ink)} RG 0.4 w ${pf(sx)} ${pf(sy-3.2*MMPT)} ${pf(8*MMPT)} ${pf(3.2*MMPT)} re B`);
        }
        y+=r.h;
        o2.push(`${rgbStr(rule)} RG 0.3 w ${pf(M)} ${pf(PH-y*MMPT)} m ${pf(PW-M)} ${pf(PH-y*MMPT)} l S`);
      });
    };
    if(L.reg&&L.regSame)drawReg(out,oy+b.H+5);
    footer(out,note);pages.push(out.join('\n'));
    if(L.reg&&!L.regSame){const o2=[];drawReg(o2,PMARGIN);footer(o2,note);pages.push(o2.join('\n'));}
    pages.forEach(c=>{const cid=add(stream('',c));pageIds.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pf(PW)} ${pf(PH)}] /Resources ${resId} 0 R /Contents ${cid} 0 R >>`));});
  });
  const dict=(m,f)=>Object.values(m).map(f).join(' ');
  objs[resId-1]=`<< /ProcSet [/PDF /Text] /Font << ${Object.keys(fontIds).map(k=>`/${k} ${fontIds[k]} 0 R`).join(' ')} >> /ExtGState << ${dict(gsMap,g=>`/${g.name} ${g.id} 0 R`)} >> /Pattern << ${dict(patIds,q=>`/${q.name} ${q.id} 0 R`)} >> >>`;
  objs[pagesId-1]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
  objs[catId-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
  const infoId=add(`<< /Title ${pdfStr(layouts.map(l=>S_(l.kind).title).join(' / '))} /Creator (Field Drafting Sheet) >>`);
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});
  const xref=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  out+=`trailer\n<< /Size ${objs.length+1} /Root ${catId} 0 R /Info ${infoId} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
  return bytes;
}
function pdfKinds(kind){return pdfOpts.what==='both'?['plan','section']:[kind];}
function syncPdfPanel(kind){
  const P=$('#pdf-'+kind);if(!P||P.hidden)return;
  ['what','paper','orient','scale'].forEach(k=>{const el=$(`#${kind}-pdf-${k}`);if(el)el.value=pdfOpts[k];});
  $(`#${kind}-pdf-reg`).checked=!!pdfOpts.reg;$(`#${kind}-pdf-pts`).checked=!!pdfOpts.pts;
  const ls=pdfKinds(kind).map(layoutFor);
  $(`#${kind}-pdf-info`).innerHTML=ls.map(l=>`<div class="${l.ok?'':'bad'}">${esc(l.msg)}</div>`).join('');
}
async function saveFile(filename,blob,type){
  const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads').catch(()=>null):null;
  if(dl){await dl.save({filename,data:blob});return'saved';}
  let file=null;try{file=new File([blob],filename,{type});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return'shared';}
    catch(e){if(e&&e.name==='AbortError')throw{code:'declined'};}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  return'downloaded';
}
const SAVED_MSG={saved:'saved.',shared:'ready. Pick Save to Files, Mail or Print.',downloaded:'downloaded.'};
async function savePDF(kind){
  const msg=$(`#${kind}-pdf-msg`),ls=pdfKinds(kind).map(layoutFor);
  if(ls.some(l=>!l.ok)){msg.textContent='Change the scale or paper so every drawing fits, then save again.';return;}
  let bytes;
  try{bytes=makePDF(ls);}catch(e){msg.textContent='The PDF could not be built: '+(e&&e.message||e);return;}
  msg.textContent='Preparing…';
  const base=(pdfOpts.what==='both'?'Field drawings':S_(kind).title).replace(/[^\w\- ]+/g,' ').trim().replace(/\s+/g,'-')||'drawing';
  try{
    const how=await saveFile(base+'.pdf',new Blob([bytes],{type:'application/pdf'}),'application/pdf');
    msg.textContent='PDF '+SAVED_MSG[how];
  }catch(e){
    const c=e&&e.code;
    msg.textContent=c==='declined'?'Save cancelled.':c==='rate_limited'?'A save prompt is already open. Finish that one first.':c==='too_large'?'The PDF is too large to save here.':'The PDF couldn’t be saved in this view.';
  }
}
['plan','section'].forEach(kind=>{
  const P=$('#pdf-'+kind),btn=$(`#view-${kind} [data-tact="pdf"]`);
  const toggle=open=>{P.hidden=!open;btn.setAttribute('aria-expanded',open);if(open){syncPdfPanel(kind);$(`#${kind}-pdf-msg`).textContent='';}};
  $(`#view-${kind} .toolbar`).addEventListener('click',e=>{const b=e.target.closest('[data-tact="pdf"]');if(b)toggle(P.hidden);});
  P.addEventListener('click',e=>{const b=e.target.closest('[data-tact]');if(!b)return;if(b.dataset.tact==='pdfclose'){toggle(false);btn.focus();}else if(b.dataset.tact==='pdfsave')savePDF(kind);});
  P.addEventListener('change',e=>{const t=e.target,k=t.dataset.pdf;if(!k)return;pdfOpts[k]=t.type==='checkbox'?t.checked:t.value;try{localStorage.setItem('field-drafting-sheet:pdf',JSON.stringify(pdfOpts));}catch(err){}$(`#${kind}-pdf-msg`).textContent='';syncPdfPanel(kind);});
});

/* ---------- top bar ---------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setTab(t.dataset.tab,true)));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='plan'||h==='section')setTab(h,false);});
$('#undoBtn').addEventListener('click',undo);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){
    const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
    e.preventDefault();undo();
  }
});
$('#dataBtn').addEventListener('click',()=>{
  const p=$('#dataPanel'),open=p.hidden;p.hidden=!open;$('#dataBtn').setAttribute('aria-expanded',open);
  if(open){$('#dataText').value=JSON.stringify({plan:state.plan,section:state.section},null,1);$('#dataMsg').textContent='';}
});
$('#copyData').addEventListener('click',()=>{
  const ta=$('#dataText');ta.value=JSON.stringify({plan:state.plan,section:state.section},null,1);
  const fall=()=>{ta.focus();ta.select();$('#dataMsg').textContent='Text selected. Press Ctrl+C or ⌘C to copy.';};
  try{navigator.clipboard.writeText(ta.value).then(()=>{$('#dataMsg').textContent='Copied to clipboard.';},fall);}catch(e){fall();}
});
function loadDataText(text){
  try{
    const d=JSON.parse(text);
    if(!d||typeof d!=='object'||(!d.plan&&!d.section))throw new Error();
    pushHistory();
    if(d.plan)state.plan=normSheet('plan',d.plan);
    if(d.section)state.section=normSheet('section',d.section);
    renderAll();save();$('#dataMsg').textContent='Drawings loaded. Use Undo to go back.';
    return true;
  }catch(e){$('#dataMsg').textContent='That data could not be read. Use the full text or a backup file saved from this app.';return false;}
}
$('#loadData').addEventListener('click',()=>loadDataText($('#dataText').value));
$('#saveBackup').addEventListener('click',async()=>{
  const d=new Date(),stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const json=JSON.stringify({plan:state.plan,section:state.section},null,1);
  try{const how=await saveFile(`field-drafting-backup-${stamp}.json`,new Blob([json],{type:'application/json'}),'application/json');$('#dataMsg').textContent='Backup '+SAVED_MSG[how];}
  catch(e){$('#dataMsg').textContent=e&&e.code==='declined'?'Backup cancelled.':'The backup couldn’t be saved here. Use Copy data instead.';}
});
$('#openBackup').addEventListener('click',()=>$('#backupFile').click());
$('#backupFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{if(loadDataText(String(r.result)))$('#dataText').value=String(r.result);};r.readAsText(f);e.target.value='';
});
function twoStep(btn,label,fn){
  let armed=false,t;
  btn.addEventListener('click',()=>{
    if(armed){clearTimeout(t);armed=false;btn.classList.remove('armed');btn.textContent=label;fn();return;}
    armed=true;btn.classList.add('armed');btn.textContent='Click again to confirm';
    t=setTimeout(()=>{armed=false;btn.classList.remove('armed');btn.textContent=label;},4000);
  });
}
twoStep($('#resetData'),'Restore example drawings',()=>{pushHistory();const s=sample();state.plan=s.plan;state.section=s.section;renderAll();save();$('#dataText').value=JSON.stringify({plan:state.plan,section:state.section},null,1);$('#dataMsg').textContent='Example drawings restored.';});
twoStep($('#blankData'),'Start blank sheets',()=>{pushHistory();const s=blank();state.plan=s.plan;state.section=s.section;renderAll();save();$('#dataText').value=JSON.stringify({plan:state.plan,section:state.section},null,1);$('#dataMsg').textContent='Blank sheets ready. Use Undo to go back.';});

/* theme follow */
const redraw=()=>{drawSVG('plan');drawSVG('section');renderRegister('section');};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw);}catch(e){}
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);

renderAll();
})();
</script>
